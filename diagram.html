<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Classroom Finder Architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1040px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: 2rem;
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Diagram Design</p>
    <h1>Classroom Finder Architecture</h1>

    <svg viewBox="0 0 1000 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cf-arch-title cf-arch-desc">
      <title id="cf-arch-title">Classroom Finder System Architecture</title>
      <desc id="cf-arch-desc">System diagram of Classroom Finder showing client portals, auth layer, API endpoints, background cron worker, and MariaDB database.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
        </marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
        </marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
        </marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Zones -->
      <!-- Ingress Zone -->
      <rect x="40" y="80" width="260" height="460" rx="8" fill="none" stroke="#4f5d75" stroke-width="0.8" stroke-dasharray="4,4" opacity="0.4"/>
      <rect x="52" y="72" width="100" height="16" fill="#f5f5f5"/>
      <text x="56" y="84" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.12em">CLIENT INGRESS</text>

      <!-- App Zone -->
      <rect x="360" y="80" width="280" height="460" rx="8" fill="none" stroke="#4f5d75" stroke-width="0.8" stroke-dasharray="4,4" opacity="0.4"/>
      <rect x="372" y="72" width="100" height="16" fill="#f5f5f5"/>
      <text x="376" y="84" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.12em">BACKEND APP</text>

      <!-- Data Zone -->
      <rect x="700" y="80" width="260" height="460" rx="8" fill="none" stroke="#eb6c36" stroke-width="0.8" stroke-dasharray="4,4" opacity="0.4"/>
      <rect x="712" y="72" width="100" height="16" fill="#f5f5f5"/>
      <text x="716" y="84" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.12em">DATA & PERSISTENCE</text>

      <!-- CONNECTORS (Drawn before boxes for proper z-index) -->
      <!-- 1. Public UI (200, 160) to API Endpoints (400, 240) -->
      <path d="M 200,160 H 292 Q 300,160 300,168 V 232 Q 300,240 308,240 H 400" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="276" y="172" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="300" y="181" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">POLL</text>

      <!-- 2. Lecturer (200, 280) to Auth (400, 160) -->
      <path d="M 200,280 H 292 Q 300,280 300,272 V 168 Q 300,160 308,160 H 400" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="276" y="244" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="300" y="253" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">LOGIN</text>

      <!-- 3. Admin (200, 400) to Auth (400, 160) -->
      <path d="M 200,400 H 312 Q 320,400 320,392 V 168 Q 320,160 328,160 H 400" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="296" y="348" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="320" y="357" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">ADMIN</text>

      <!-- 4. Auth (560, 160) to API Endpoints (560, 200) -->
      <line x1="480" y1="192" x2="480" y2="208" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="460" y="194" width="40" height="12" rx="2" fill="#f5f5f5"/>
      <text x="480" y="203" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">VERIFY</text>

      <!-- 5. API Endpoints (560, 256) to DB (740, 256) -->
      <line x1="560" y1="256" x2="740" y2="256" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <rect x="626" y="238" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="650" y="247" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">PDO/SQL</text>

      <!-- 6. Cron Expire (480, 360) to DB (740, 280) -->
      <path d="M 560,400 H 642 Q 650,400 650,392 V 288 Q 650,280 658,280 H 740" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <rect x="626" y="360" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="650" y="369" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">EXPIRE</text>

      <!-- NODES -->
      <!-- Node 1: Public View -->
      <g id="node-public">
        <rect x="60" y="128" width="140" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="68" y="136" width="32" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" opacity="0.4"/>
        <text x="84" y="145" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">WEB</text>
        <text x="130" y="162" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Public Portal</text>
        <text x="130" y="178" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">index.php</text>
      </g>

      <!-- Node 2: Lecturer App -->
      <g id="node-lecturer">
        <rect x="60" y="248" width="140" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="68" y="256" width="32" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" opacity="0.4"/>
        <text x="84" y="265" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">APP</text>
        <text x="130" y="282" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">QR Scanner</text>
        <text x="130" y="298" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">lecturer/scanner</text>
      </g>

      <!-- Node 3: Admin Dashboard -->
      <g id="node-admin">
        <rect x="60" y="368" width="140" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="68" y="376" width="36" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" opacity="0.4"/>
        <text x="86" y="385" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">ADMIN</text>
        <text x="130" y="402" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Management</text>
        <text x="130" y="418" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">admin/classrooms</text>
      </g>

      <!-- Node 4: Auth & Session -->
      <g id="node-auth">
        <rect x="400" y="128" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="408" y="136" width="32" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" opacity="0.4"/>
        <text x="424" y="145" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">AUTH</text>
        <text x="480" y="162" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Session & Auth</text>
        <text x="480" y="178" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">auth_check.php</text>
      </g>

      <!-- Node 5: API Endpoints -->
      <g id="node-api">
        <rect x="400" y="216" width="160" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="408" y="224" width="28" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" opacity="0.4"/>
        <text x="422" y="233" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">API</text>
        <text x="480" y="254" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Core Services</text>
        <text x="480" y="270" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">scan / status / release</text>
        <text x="480" y="284" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">JSON responses</text>
      </g>

      <!-- Node 6: Cron Worker -->
      <g id="node-cron">
        <rect x="400" y="368" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-dasharray="4,3"/>
        <rect x="408" y="376" width="36" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" opacity="0.4"/>
        <text x="426" y="385" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">CRON</text>
        <text x="480" y="402" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Expiry Worker</text>
        <text x="480" y="418" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">cron/expire.php</text>
      </g>

      <!-- Node 7: MariaDB Database (Focal Node) -->
      <g id="node-db">
        <rect x="740" y="216" width="180" height="96" rx="6" fill="rgba(235,108,54,0.06)" stroke="#eb6c36" stroke-width="1.2"/>
        <rect x="748" y="224" width="48" height="12" rx="2" fill="none" stroke="#eb6c36" stroke-width="0.8"/>
        <text x="772" y="233" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">STORAGE</text>
        <text x="830" y="256" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">MariaDB / MySQL</text>
        <text x="830" y="274" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">config/database.php</text>
        <text x="830" y="290" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">rooms · users · logs</text>
      </g>

      <!-- LEGEND -->
      <line x1="40" y1="580" x2="960" y2="580" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="40" y="608" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

      <line x1="120" y1="604" x2="152" y2="604" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="164" y="608" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace">Internal Call</text>

      <line x1="280" y1="604" x2="312" y2="604" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <text x="324" y="608" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace">HTTP / Poll</text>

      <line x1="440" y1="604" x2="472" y2="604" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <text x="484" y="608" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace">Database Read/Write</text>

      <line x1="640" y1="604" x2="672" y2="604" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <text x="684" y="608" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace">Async / Scheduled</text>
    </svg>
  </div>
</body>
</html>
